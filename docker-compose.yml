version: '3.8'

services:
  # HEIMDALL: Authenticator (The Watchman)
  heimdall-backend:
    restart: unless-stopped
    build: ./Yggdrasil/heimdall/backend
    # Note: With network_mode: "host", ports mapping is ignored.
    # The app will be accessible directly on host:5000 (or PORT env var)
    ports:
      - "127.0.0.1:5001:5000"   # this Mac only: the API has no login
    volumes:
      - ./Yggdrasil/heimdall/backend:/app
      - /etc/localtime:/etc/localtime:ro
    environment:
      - FLASK_ENV=development
      - PORT=5000
      - RATATOSKR_URL=http://ratatoskr:3000
      # ArchiSteamFarm API (card farming). Empty password = ASF integration off;
      # `make asf-setup` puts it in the root .env (gitignored).
      - ASF_URL=http://asf:1242
      - ASF_IPC_PASSWORD=${ASF_IPC_PASSWORD:-}
      - HEIMDALL_SECRET_KEY=${HEIMDALL_SECRET_KEY:-change_this_to_a_secure_random_string_in_production}
      # Proxy settings to change outbound IP and avoid Steam rate limits (HTTP 429)
      # Uncomment and set these environment variables to use a proxy/VPN:
      #
      # For HTTP/HTTPS proxy:
      # - HTTP_PROXY=http://proxy-host:port
      # - HTTPS_PROXY=http://proxy-host:port
      # - NO_PROXY=localhost,127.0.0.1
      #
      # For SOCKS5 proxy (VPN):
      # - SOCKS_PROXY=socks5://user:pass@proxy-host:port
      #   or without auth: SOCKS_PROXY=socks5://proxy-host:port
      #
      # Example: SOCKS_PROXY=socks5://127.0.0.1:1080 (local SOCKS proxy)
      # Example: HTTP_PROXY=http://proxy.example.com:8080
    command: python app.py

  heimdall-frontend:
    build: ./Yggdrasil/heimdall/frontend
    ports:
      - "127.0.0.1:3000:5173"   # this Mac only: the UI has no login
    volumes:
      - ./Yggdrasil/heimdall/frontend:/app
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      - heimdall-backend

  # RATATOSKR: Casemove/Courier Service (Node.js)
  ratatoskr:
    build: ./Yggdrasil/ratatoskr
    ports:
      - "127.0.0.1:3001:3000"   # this Mac only (the backend uses the Docker network)
    environment:
      - PORT=3000
      - HEIMDALL_API_URL=http://heimdall-backend:5000
      - MOVE_DELAY_MS=400
      # Auto-disconnect after idle (ms). 0 = never. Default 3600000 (1 hour).
      # - SESSION_IDLE_TIMEOUT_MS=1800000
    volumes:
      - ./Yggdrasil/ratatoskr:/app
      - /app/node_modules

  # ASF: ArchiSteamFarm — idles games so their trading cards drop (Andvari's farmer).
  # Hardened: pinned image digest, non-root, no Linux capabilities, read-only
  # filesystem, and NO published port — only heimdall-backend can reach its API.
  # config/ holds ASF's login tokens (no passwords, no 2FA seeds): gitignored, owner-only.
  # First run: `make asf-setup`. See Yggdrasil/asf/README.md.
  asf:
    image: justarchi/archisteamfarm:6.3.9.6@sha256:5c4bce8626aafa82c8d6074a57c7ed84f28d1c875e4fe5697917c7b5f069b4df
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    volumes:
      - ./Yggdrasil/asf/config:/app/config
      - ./Yggdrasil/asf/logs:/app/logs
    environment:
      - DOTNET_CLI_TELEMETRY_OPTOUT=true
