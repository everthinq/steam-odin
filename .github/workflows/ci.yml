name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Yggdrasil/heimdall/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff, non-blocking for now)
        run: ruff check . || true
      - name: Tests (pytest)
        run: pytest
      - name: Dependency audit (non-blocking)
        run: pip-audit -r requirements.txt || true

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Yggdrasil/heimdall/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Yggdrasil/heimdall/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint, non-blocking for now)
        run: npm run lint || true
      - name: Build
        run: npm run build
